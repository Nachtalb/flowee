name = "flowee"
main = "src/index.ts"
compatibility_date = "2026-11-15"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

# One Durable Object per workspace (idFromName(workspace id)).
[[durable_objects.bindings]]
name = "WORKSPACE"
class_name = "Workspace"

# Managed mode: one Instance object (idFromName("instance")) keeps the workspaces, sealed secrets and wizard.
[[durable_objects.bindings]]
name = "INSTANCE"
class_name = "Instance"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Workspace"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Instance"]

[version_metadata]
binding = "VERSION"

# The workspaces are flowee.config.json (or the FLOWEE_CONFIG var/secret, which wins): see docs/configuration.md.
# Secrets (wrangler secret put NAME) are whatever names that document references.
[vars]
FLOWEE_MODE = "standalone"

# The agent material at its repository paths (skills, docs, client, schema, presets, bundle.tar.gz): scripts/bundle.ts
# builds served/ before every `wrangler dev` and `wrangler deploy`; src/adapters/served.ts answers with its headers.
[build]
command = "bun scripts/bundle.ts"

[assets]
directory = "./served"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
